<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/plantilla :: head}"/>

    <body>
        <!-- fragmento 1 para Agregar producto en ventana modal -->
        <section th:fragment="agregar">
            <!-- Button trigger modal -->
            <div class='row py-4 mb-2 bg-light'>
                <div class='col-md-i'></div>
                <div class='col-md-3'>
                    <button type="button" class="btn btn-primary"
                            data-bs-toggle="modal" data-bs-target="#agregarProductoModal">
                        <i class="fa-solid fa-plus"></i> [[#{producto.agregar}]]</button>
                </div>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="agregarProductoModal" tabindex="-1"
                 aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">
                                <i class="fa-solid fa-layer-group"></i> [[#{producto.agregar}]]</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action='@{/producto/guardar}' th:object='${producto}'
                              class='was-validated' enctype="multipart/form-data" method="post">
                            <div class='modal-body'>
                                <div class='mb-3'>
                                    <label for="idCategoria">[[#{producto.categoria}]]</label>
                                    <select class="form-select" name="idCategoria"
                                            aria-label="Default select example">
                                        <option th:each="c : ${categorias}" th:value="${c.idCategoria}">
                                            [[${c.descripcion}]]</option>
                                    </select>
                                </div>
                                <div class='mb-3'>
                                    <label>[[#{producto.descripcion}]]</label>
                                    <input type="text" name='descripcion' class='form-control' maxlength="50" required/>
                                </div>
                                <div class='mb-3'>
                                    <label for="detalle">[[#{producto.detalle}]]</label>
                                    <textarea class="form-control" name='detalle' rows="3"></textarea>
                                </div>
                                <div class='mb-3'>
                                    <label>[[#{producto.precio}]]</label>
                                    <input type="number" step="0.01" name='precio' class='form-control' required/>
                                </div>
                                <div class='mb-3'>
                                    <label>[[#{producto.existencias}]]</label>
                                    <input type="number" name='existencias' class='form-control' required/>
                                </div>
                                <div class='mb-3 form-check'>
                                    <input type="checkbox" name='activo' class='form-check-input'/>
                                    <label class="form-check-label">[[#{producto.activo}]]</label>
                                </div>
                                <div class='mb-3'>
                                    <label>[[#{producto.imagen}]]</label>
                                    <input type="file" name='imagenFile' class='form-control'/>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmento 2 para Editar producto -->
        <section th:fragment="editar">
            <div class='row py-4'>
                <div class='col-md-3'>
                    <a th:href="@{/producto/listado}" class='btn btn-primary'>
                        <i class="fa-solid fa-arrow-left"></i> [[#{accion.regresar}]]</a>
                </div>
                <div class='col-md-3'>
                    <button type="submit" form="formEditar" class='btn btn-success'>
                        <i class="fa-solid fa-check"></i> [[#{accion.guardar}]]</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header">[[#{accion.actualizar}]]</div>
                <div class="card-body">
                    <form id="formEditar" th:action='@{/producto/guardar}' th:object='${producto}'
                          class='was-validated' enctype="multipart/form-data" method="post">
                        <input type="hidden" th:field="*{idProducto}"/>
                        <div class='mb-3'>
                            <label>[[#{producto.categoria}]]</label>
                            <select class="form-select" name="idCategoria">
                                <option th:each="c : ${categorias}" th:value="${c.idCategoria}"
                                        th:selected="${c.idCategoria == producto.idCategoria}">
                                    [[${c.descripcion}]]</option>
                            </select>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{producto.descripcion}]]</label>
                            <input type="text" th:field="*{descripcion}" class='form-control' maxlength="50" required/>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{producto.detalle}]]</label>
                            <textarea class="form-control" th:field="*{detalle}" rows="3"></textarea>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{producto.precio}]]</label>
                            <input type="number" step="0.01" th:field="*{precio}" class='form-control' required/>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{producto.existencias}]]</label>
                            <input type="number" th:field="*{existencias}" class='form-control' required/>
                        </div>
                        <div class='mb-3 form-check'>
                            <input type="checkbox" th:field="*{activo}" class='form-check-input'/>
                            <label class="form-check-label">[[#{producto.activo}]]</label>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{producto.imagen}]]</label>
                            <input type="file" name='imagenFile' class='form-control'/>
                            <img th:if="${producto.rutaImagen}" th:src="${producto.rutaImagen}"
                                 style="max-width:150px" class="mt-2"/>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </body>
</html>
